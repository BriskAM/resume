name: Build and publish resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Verify LaTeX packages
        run: |
          for package in \
            geometry.sty \
            titlesec.sty \
            tabularx.sty \
            array.sty \
            xcolor.sty \
            enumitem.sty \
            fontawesome5.sty \
            amsmath.sty \
            hyperref.sty \
            ulem.sty \
            eso-pic.sty \
            calc.sty \
            bookmark.sty \
            lastpage.sty \
            changepage.sty \
            paracol.sty \
            ifthen.sty \
            needspace.sty \
            iftex.sty \
            lmodern.sty
          do
            kpsewhich "$package"
          done

      - name: Build resume
        run: ./compile.sh

      - name: Archive changed resume PDF
        run: |
          mkdir -p versions
          should_archive=1
          latest_version="$(find versions -maxdepth 1 -name '*.pdf' -type f | sort | tail -n 1 || true)"

          if [ -n "$latest_version" ]; then
            pdftotext akshit_mehta_resume.pdf /tmp/current-resume.txt
            pdftotext "$latest_version" /tmp/latest-resume.txt
            if cmp -s /tmp/current-resume.txt /tmp/latest-resume.txt; then
              should_archive=0
              echo "Latest archived PDF already matches the generated resume content."
            fi
          fi

          if [ "$should_archive" -eq 1 ]; then
            stamp="$(date -u +'%Y-%m-%d-%H%M')"
            short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            cp akshit_mehta_resume.pdf "versions/akshit-mehta-resume-${stamp}-${short_sha}.pdf"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions
            git commit -m "Archive resume PDF ${stamp} [skip ci]" || true
            git push
          fi

      - name: Upload Catbox mirror
        id: catbox
        run: |
          catbox_url="$(curl -fsS --connect-timeout 10 --max-time 30 \
            -F 'reqtype=fileupload' \
            -F 'fileToUpload=@akshit_mehta_resume.pdf;type=application/pdf' \
            https://catbox.moe/user/api.php || true)"

          case "$catbox_url" in
            https://*) ;;
            *)
              echo "Catbox upload did not complete within 30 seconds or returned an unexpected response." >&2
              catbox_url=""
              ;;
          esac

          echo "url=$catbox_url" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          mkdir -p public/versions
          cp akshit_mehta_resume.pdf public/akshit_mehta_resume.pdf
          find versions -maxdepth 1 -name '*.pdf' -type f -exec cp {} public/versions/ \;

          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          def label_for(path: Path) -> str:
              stem = path.stem.removeprefix("akshit-mehta-resume-")
              parts = stem.split("-")
              if len(parts) >= 5:
                  timestamp = f"{parts[0]}-{parts[1]}-{parts[2]} {parts[3][:2]}:{parts[3][2:]} UTC"
                  return f"{timestamp} ({parts[4]})"
              return stem.replace("-", " ")

          versions = sorted(Path("versions").glob("*.pdf"), reverse=True)
          main_items = []
          index_items = []
          for version in versions[:8]:
              name = escape(version.name)
              label = escape(label_for(version))
              main_items.append(f'  <li><a href="versions/{name}">{label}</a></li>')
              index_items.append(f'  <li><a href="{name}">{label}</a></li>')

          if not main_items:
              main_items.append("  <li>No archived versions yet.</li>")
              index_items.append("  <li>No archived versions yet.</li>")

          version_links = "<ul class=\"version-list\">\n" + "\n".join(main_items) + "\n</ul>\n"
          catbox_url = "${{ steps.catbox.outputs.url }}"
          if catbox_url:
              catbox_link = f'<a class="button" href="{escape(catbox_url)}">Catbox Mirror</a>'
          else:
              catbox_link = ""

          template = Path("docs/index.html").read_text()
          html = template.replace("<!-- VERSION_LINKS -->", version_links)
          html = html.replace("<!-- CATBOX_LINK -->", catbox_link)
          Path("public/index.html").write_text(html)

          version_index = """<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Resume Version History</title>
            </head>
            <body>
              <h1>Resume Version History</h1>
              <ul>
          """ + "\n".join(index_items) + """
              </ul>
              <p><a href="../">Back to latest resume</a></p>
            </body>
          </html>
          """
          Path("public/versions/index.html").write_text(version_index)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

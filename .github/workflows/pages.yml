name: Build and publish resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Verify LaTeX packages
        run: |
          for package in \
            geometry.sty \
            titlesec.sty \
            tabularx.sty \
            array.sty \
            xcolor.sty \
            enumitem.sty \
            fontawesome5.sty \
            amsmath.sty \
            hyperref.sty \
            ulem.sty \
            eso-pic.sty \
            calc.sty \
            bookmark.sty \
            lastpage.sty \
            changepage.sty \
            paracol.sty \
            ifthen.sty \
            needspace.sty \
            iftex.sty \
            lmodern.sty
          do
            kpsewhich "$package"
          done

      - name: Inject contact secrets
        env:
          RESUME_PHONE_LINK: ${{ secrets.RESUME_PHONE_LINK }}
          RESUME_PHONE_DISPLAY: ${{ secrets.RESUME_PHONE_DISPLAY }}
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
        run: |
          python3 -c "
          import os, glob
          for path in glob.glob('*.tex'):
              content = open(path).read()
              content = content.replace('email@example.com', os.environ['RESUME_EMAIL'])
              content = content.replace('+91-0000000000', os.environ['RESUME_PHONE_LINK'])
              content = content.replace('+91 0000000000', os.environ['RESUME_PHONE_DISPLAY'])
              open(path, 'w').write(content)
          "

      - name: Build resume
        run: ./compile.sh

      - name: Build domain-specific resumes
        run: |
          for f in resume-*.tex; do
            if [ "$f" = "resume-template.tex" ]; then
              continue
            fi
            domain="${f#resume-}"
            domain="${domain%.tex}"
            echo "Compiling domain-specific resume: $f -> akshit_mehta_resume_${domain}.pdf"
            python3 main.py "$f" "akshit_mehta_resume_${domain}"
          done

      - name: Archive resumes to private repository
        env:
          ARCHIVE_PAT: ${{ secrets.ARCHIVE_PAT }}
        run: |
          # 1. Clone private archive repository
          git clone https://x-access-token:${{ secrets.ARCHIVE_PAT }}@github.com/BriskAM/resume-archive.git archive-repo
          
          # 2. Prepare directories in archive repo
          mkdir -p archive-repo/versions
          
          # 3. Check if main resume content changed compared to the latest version in the archive
          should_archive=1
          latest_version="$(find archive-repo/versions -maxdepth 1 -name '*.pdf' -type f | sort | tail -n 1 || true)"
          
          if [ -n "$latest_version" ]; then
            pdftotext akshit_mehta_resume.pdf /tmp/current-resume.txt
            pdftotext "$latest_version" /tmp/latest-resume.txt
            if cmp -s /tmp/current-resume.txt /tmp/latest-resume.txt; then
              should_archive=0
              echo "Latest archived PDF already matches the generated resume content."
            fi
          fi
          
          if [ "$should_archive" -eq 1 ]; then
            stamp="$(date -u +'%Y-%m-%d-%H%M')"
            short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            cp akshit_mehta_resume.pdf "archive-repo/versions/akshit-mehta-resume-${stamp}-${short_sha}.pdf"
          fi
          
          # 4. Copy current domain-specific resumes
          cp akshit_mehta_resume_*.pdf archive-repo/ || true
          
          # 5. Commit and push to private archive repository
          cd archive-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Archive resumes from commit BriskAM/resume@$GITHUB_SHA [skip ci]"
            git push
          else
            echo "No changes in resumes or archives to commit."
          fi

      - name: Upload Catbox mirror
        id: catbox
        run: |
          catbox_url="$(curl -fsS --connect-timeout 30 --max-time 30 \
            -F 'reqtype=fileupload' \
            -F 'fileToUpload=@akshit_mehta_resume.pdf;type=application/pdf' \
            https://catbox.moe/user/api.php || true)"

          case "$catbox_url" in
            https://*) ;;
            *)
              echo "Catbox upload did not complete within 30 seconds or returned an unexpected response." >&2
              catbox_url=""
              ;;
          esac

          echo "url=$catbox_url" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp akshit_mehta_resume.pdf public/akshit_mehta_resume.pdf

          python3 - <<'PY'
          from html import escape
          from pathlib import Path

          catbox_url = "${{ steps.catbox.outputs.url }}"
          if catbox_url:
              catbox_link = f'<a class="button" href="{escape(catbox_url)}">Catbox Mirror</a>'
          else:
              catbox_link = ""

          template = Path("docs/index.html").read_text()
          html = template.replace("<!-- CATBOX_LINK -->", catbox_link)
          Path("public/index.html").write_text(html)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

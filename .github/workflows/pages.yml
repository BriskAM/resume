name: Build and publish resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Verify LaTeX packages
        run: |
          for package in \
            geometry.sty \
            titlesec.sty \
            tabularx.sty \
            array.sty \
            xcolor.sty \
            enumitem.sty \
            fontawesome5.sty \
            amsmath.sty \
            hyperref.sty \
            ulem.sty \
            eso-pic.sty \
            calc.sty \
            bookmark.sty \
            lastpage.sty \
            changepage.sty \
            paracol.sty \
            ifthen.sty \
            needspace.sty \
            iftex.sty \
            lmodern.sty
          do
            kpsewhich "$package"
          done

      - name: Build resume
        run: ./compile.sh

      - name: Upload backup mirror
        id: backup
        run: |
          backup_url="$(curl -fsS -F 'reqtype=fileupload' -F 'fileToUpload=@akshit_mehta_resume.pdf;type=application/pdf' https://catbox.moe/user/api.php)"
          case "$backup_url" in
            https://*) ;;
            *) echo "Unexpected Catbox response: $backup_url" >&2; exit 1 ;;
          esac
          echo "url=$backup_url" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          sed "s|__BACKUP_URL__|${{ steps.backup.outputs.url }}|g" docs/index.html > public/index.html
          printf '%s\n' "${{ steps.backup.outputs.url }}" > public/backup-url.txt
          cp akshit_mehta_resume.pdf public/akshit_mehta_resume.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

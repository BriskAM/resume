<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akshit Mehta Resume</title>
    <meta name="description" content="Latest resume PDF for Akshit Mehta.">
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #15171a;
      }

      main {
        width: min(680px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid #d8dde5;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 20px;
        color: #4d5663;
      }

      a {
        color: #0b57d0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #0b57d0;
        border-radius: 6px;
        font-weight: 600;
        text-decoration: none;
      }

      .button.primary {
        background: #0b57d0;
        color: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111318;
          color: #f2f4f8;
        }

        main {
          background: #191c22;
          border-color: #303642;
        }

        p {
          color: #b8c0cc;
        }

        a {
          color: #8ab4f8;
        }

        .button {
          border-color: #8ab4f8;
        }

        .button.primary {
          background: #8ab4f8;
          color: #101318;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Akshit Mehta Resume</h1>
      <p>Latest generated resume PDF. This page is rebuilt automatically from the LaTeX source in the GitHub repository.</p>
      <div class="actions">
        <a class="button primary" href="akshit_mehta_resume.pdf" download>Download PDF</a>
        <a class="button" href="akshit_mehta_resume.pdf">Open PDF</a>
        <a class="button" href="https://files.catbox.moe/peyq2x.pdf">Backup</a>
        <a class="button" href="https://github.com/BriskAM/resume">Source</a>
      </div>
    </main>
  </body>
</html>
